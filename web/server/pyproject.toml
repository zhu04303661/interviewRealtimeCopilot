[project]
name = "irc-web"
version = "0.1.0"
description = "Interview Realtime Copilot website: pages, accounts and Stripe subscriptions"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.5",
    "cryptography==46.0.3",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-aiohttp==1.1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
exclude-newer = "2026-11-06T00:00:00Z"

[tool.ruff]
line-length = 140
