<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="title.login">Sign in — Interview Realtime Copilot</title><meta name="description" content="Real-time interview copilot: live transcript, question detection, answer hints grounded in your own resume, spoken practice and debriefs."><link rel="stylesheet" href="/site.css"><script src="/i18n.js" defer></script><script src="/site.js" defer></script></head><body data-page="login">
<div class="wrap"><div class="auth"><h2 id="title" style="margin-top:0" data-i18n="auth.signin">Sign in</h2>
<form id="auth"><label class="field"><span data-i18n="auth.email">Email</span><input class="input" name="email" type="email" autocomplete="email" required></label>
<label class="field"><span><span data-i18n="auth.password">Password</span> <span class="faint" id="rule"></span></span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
<p class="error" id="error"></p><button class="btn primary lg" style="width:100%" id="submit" data-i18n="auth.signin">Sign in</button></form>
<p class="small muted center"><a href="#" id="switch" data-i18n="auth.toSignup">New here? Create an account</a></p></div></div></body></html>
