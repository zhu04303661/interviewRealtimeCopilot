<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account — Interview Realtime Copilot</title><meta name="description" content="Real-time interview copilot: bilingual live transcript, question detection, answer hints grounded in your own resume, and spoken practice interviews.">
<link rel="stylesheet" href="/site.css"><script src="/site.js" defer></script></head><body>

<div class="wrap" style="max-width:760px;padding:60px 24px"><div class="eyebrow">Account · 账号</div><h1 style="font-size:38px">Your subscription</h1>
<div id="notice"></div><div class="card" id="panel"><p class="muted">Loading… · 加载中…</p></div></div>
<script>
window.addEventListener('DOMContentLoaded', async () => {
  if (location.search.includes('checkout=success')) document.getElementById('notice').innerHTML = '<div class="notice">Payment received — Pro activates as soon as Stripe confirms it (usually seconds). · 支付成功，Stripe 确认后立即开通。</div>';
  const { user } = await api('/api/me');
  if (!user) { location.href = '/login.html?next=/account.html'; return; }
  const pro = user.plan !== 'free';
  const until = user.current_period_end ? new Date(user.current_period_end * 1000).toLocaleDateString() : '';
  document.getElementById('panel').innerHTML = `
    <p><b>${user.email}</b></p>
    <p>Plan · 套餐：<b>${pro ? (user.plan === 'yearly' ? 'Pro yearly · 年付' : 'Pro monthly · 月付') : 'Free · 免费'}</b> <span class="faint">${user.status !== 'none' ? '(' + user.status + ')' : ''}</span></p>
    ${until ? `<p class="muted">Renews or ends on · 续费/到期：${until}</p>` : ''}
    <div class="cta">${pro ? '<button class="btn primary" id="portal">Manage billing · 管理订阅</button>' : '<a class="btn primary" href="/pricing.html">Upgrade to Pro · 升级 Pro</a>'}
    <a class="btn" href="/download.html">Download the app · 下载应用</a><button class="btn" id="logout">Sign out · 退出</button></div><p class="error" id="error"></p>`;
  document.getElementById('logout').onclick = async () => { await api('/api/logout', {}); location.href = '/'; };
  const portal = document.getElementById('portal');
  if (portal) portal.onclick = async () => { try { location.href = (await api('/api/portal', {})).url; } catch (e) { document.getElementById('error').textContent = e.message; } };
});
</script>
</body></html>
