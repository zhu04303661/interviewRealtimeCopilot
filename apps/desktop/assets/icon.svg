<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- App icon: a speech bubble holding a live waveform (hearing the interview) with a spark (the hint). macOS grid: 824px squircle on a 1024 canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6bff"/><stop offset=".45" stop-color="#4a6dff"/><stop offset="1" stop-color="#16c8f5"/></linearGradient>
    <radialGradient id="glow" cx=".28" cy=".18" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#0a0f3c" stop-opacity="0"/><stop offset="1" stop-color="#0a0f3c" stop-opacity=".38"/></linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3ecff"/></linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5cff"/><stop offset="1" stop-color="#14b8ee"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0b1040" flood-opacity=".45"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1250" flood-opacity=".35"/></filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#drop)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/></g>
  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#shade)"/>
    <circle cx="790" cy="820" r="300" fill="#19e0ff" opacity=".18"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="6"/>
  <!-- speech bubble -->
  <g filter="url(#soft)">
    <path d="M300 300h424a84 84 0 0 1 84 84v236a84 84 0 0 1-84 84H520l-118 96c-12 10-30 1-30-15v-81h-72a84 84 0 0 1-84-84V384a84 84 0 0 1 84-84z" fill="url(#bubble)"/>
  </g>
  <!-- waveform -->
  <g fill="url(#bars)">
    <rect x="322" y="462" width="46" height="80" rx="23"/>
    <rect x="406" y="412" width="46" height="180" rx="23"/>
    <rect x="490" y="366" width="46" height="272" rx="23"/>
    <rect x="574" y="428" width="46" height="148" rx="23"/>
    <rect x="658" y="456" width="46" height="92" rx="23"/>
  </g>
  <!-- spark -->
  <path d="M770 176c8 52 28 72 80 80-52 8-72 28-80 80-8-52-28-72-80-80 52-8 72-28 80-80z" fill="#fff"/>
  <path d="M866 318c4 24 13 33 37 37-24 4-33 13-37 37-4-24-13-33-37-37 24-4 33-13 37-37z" fill="#fff" opacity=".85"/>
</svg>
